<!-- 💖 ADD THIS RIGHT BEFORE </body> -->

<!-- 💌 TYPING TEXT -->
<div class="typing-container">
  <h2 id="typing-text"></h2>
</div>

<!-- 🫶 FULLSCREEN IMAGE VIEWER -->
<div class="image-viewer" id="viewer">
  <span class="close-viewer" onclick="closeViewer()">✕</span>
  <img id="viewer-img">
</div>

<style>

/* 💌 TYPING TEXT */

.typing-container{
  text-align:center;
  margin-top:90px;
  margin-bottom:40px;
}

#typing-text{

  display:inline-block;

  color:#ffb7d5;

  font-size:
  clamp(24px,4vw,48px);

  border-right:3px solid #ff9fc7;

  white-space:nowrap;

  overflow:hidden;

  width:0;

  animation:
  typing 5s steps(40,end) forwards,
  blink 0.8s infinite;

  text-shadow:
  0 0 10px rgba(255,120,170,0.5);
}

@keyframes typing{
  from{
    width:0;
  }
  to{
    width:100%;
  }
}

@keyframes blink{
  50%{
    border-color:transparent;
  }
}

/* 🫶 FULLSCREEN VIEWER */

.image-viewer{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,0.92);

  display:none;

  justify-content:center;
  align-items:center;

  z-index:9999;

  padding:20px;
}

.image-viewer img{

  max-width:95%;
  max-height:90%;

  border-radius:25px;

  box-shadow:
  0 0 40px rgba(255,120,170,0.35);
}

.close-viewer{

  position:absolute;

  top:25px;
  right:30px;

  font-size:35px;

  color:white;

  cursor:pointer;
}

/* 🌹 CURSOR TRAIL */

.cursor-heart{

  position:fixed;

  width:12px;
  height:12px;

  background:#ff6ea8;

  transform:rotate(45deg);

  pointer-events:none;

  z-index:9999;

  animation:heartFade 1s linear forwards;
}

.cursor-heart::before,
.cursor-heart::after{

  content:'';

  position:absolute;

  width:12px;
  height:12px;

  background:#ff6ea8;

  border-radius:50%;
}

.cursor-heart::before{
  top:-6px;
  left:0;
}

.cursor-heart::after{
  left:-6px;
  top:0;
}

@keyframes heartFade{

  0%{
    opacity:1;
    transform:
    rotate(45deg)
    scale(1);
  }

  100%{
    opacity:0;
    transform:
    rotate(45deg)
    scale(0.2)
    translateY(-20px);
  }

}

/* 💖 HEART EXPLOSION */

.click-heart{

  position:fixed;

  color:#ff77aa;

  font-size:18px;

  pointer-events:none;

  animation:explode 1s ease forwards;

  z-index:9999;
}

@keyframes explode{

  0%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:
    translateY(-50px)
    scale(2);
  }

}

</style>

<script>

/* 💌 TYPING TEXT */

const text =
"You are my favorite feeling, Tanjeena 💖";

const typingText =
document.getElementById("typing-text");

let i = 0;

function type(){

  if(i < text.length){

    typingText.innerHTML += text.charAt(i);

    i++;

    setTimeout(type,80);
  }
}

type();

/* 🫶 FULLSCREEN IMAGE */

const images =
document.querySelectorAll(".photo-gallery img");

const viewer =
document.getElementById("viewer");

const viewerImg =
document.getElementById("viewer-img");

images.forEach(img=>{

  img.addEventListener("click",()=>{

    viewer.style.display="flex";

    viewerImg.src = img.src;

  });

});

function closeViewer(){

  viewer.style.display="none";
}

/* 🌹 CURSOR TRAIL */

document.addEventListener("mousemove",(e)=>{

  const heart =
  document.createElement("div");

  heart.classList.add("cursor-heart");

  heart.style.left = e.clientX + "px";
  heart.style.top = e.clientY + "px";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },1000);

});

/* 💖 CLICK EXPLOSION */

document.addEventListener("click",(e)=>{

  for(let i=0;i<8;i++){

    const heart =
    document.createElement("div");

    heart.classList.add("click-heart");

    heart.innerHTML="💖";

    heart.style.left =
    e.clientX + (Math.random()*60-30) + "px";

    heart.style.top =
    e.clientY + (Math.random()*60-30) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },1000);

  }

});

</script>
